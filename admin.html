<style>

body {

}

.container {
    max-width: 700px;
    margin: auto;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,80,90,.10);
}

h1 {
    text-align: center;
    color: #07838f;
}

p {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #c8e7eb;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    box-sizing: border-box;
}

textarea {
    height: 120px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #07838f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.logout {
    background: #c0392b;
}

#loginBox {
    display: block;
}

#adminBox {
    display: none;
}

#message,
#loginMessage {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    display: none;
}

.preview {
    margin-top: 15px;
    display: none;
    text-align: center;
}

.preview img {
    max-width: 100%;
    max-height: 250px;
    border-radius: 12px;
    object-fit: cover;
}

</style>

</head>

بيع
</option>

</option>

</select>

<select id="status">

<button
id="saveButton"
