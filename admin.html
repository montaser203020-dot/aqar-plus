<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>عقار بلس - لوحة التحكم</title>

<style>

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #f4fbfc;
    margin: 0;
    padding: 20px;
    color: #173f48;
}

.container {
    max-width: 700px;
    margin: auto;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,80,90,.10);
}

h1 {
    text-align: center;
    color: #07838f;
}

p {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #c8e7eb;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    box-sizing: border-box;
}

textarea {
    height: 120px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #07838f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.logout {
    background: #c0392b;
}

#loginBox {
    display: block;
}

#adminBox {
    display: none;
}

#message,
#loginMessage {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    display: none;
}

.preview {
    margin-top: 15px;
    display: none;
    text-align: center;
}

.preview img {
    max-width: 100%;
    max-height: 250px;
    border-radius: 12px;
    object-fit: cover;
}

hr {
    margin: 25px 0;
    border: 0;
    border-top: 1px solid #e0eff1;
}

</style>

</head>

<body>

<div class="container">


<!-- ==========================================
     تسجيل الدخول
========================================== -->

<div class="box" id="loginBox">

<h1>
🔐 عقار بلس
</h1>

<p>
تسجيل الدخول إلى لوحة التحكم
</p>

<div id="loginMessage"></div>

<form id="loginForm">

<label>
البريد الإلكتروني
</label>

<input
id="loginEmail"
type="email"
value="montaser203020@gmail.com"
readonly>


<label>
كلمة المرور
</label>

<input
id="loginPassword"
type="password"
required
placeholder="اكتب كلمة المرور">


<button
id="loginButton"
type="submit">

🔐 تسجيل الدخول

</button>

</form>

</div>


<!-- ==========================================
     لوحة التحكم
========================================== -->

<div class="box" id="adminBox">

<h1>
🏠 عقار بلس
</h1>

<p>
لوحة التحكم الخاصة بك
</p>


<button
class="logout"
id="logoutButton"
type="button">

🚪 تسجيل الخروج

</button>


<hr>


<div id="message"></div>


<form id="propertyForm">


<!-- العنوان -->

<label>
عنوان العقار *
</label>

<input
id="title"
type="text"
required
placeholder="مثال: شقة للبيع في قنا">


<!-- السعر -->

<label>
السعر *
</label>

<input
id="price"
type="number"
required
placeholder="500000">


<!-- المدينة -->

<label>
المدينة *
</label>

<select
id="location"
required>

<option value="">
اختر المدينة
</option>

<option value="قنا">
قنا
</option>

<option value="الغردقة">
الغردقة
</option>

</select>


<!-- الوصف -->

<label>
الوصف
</label>

<textarea
id="description"
placeholder="وصف العقار"></textarea>


<!-- نوع العقار -->

<label>
نوع العق
